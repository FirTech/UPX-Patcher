[package]
name = "UPX-Patcher"
version = "1.0.0"
edition = "2024"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'

[build-dependencies]
thunk-rs = "0.3.5"
embed-resource = "2.4.3"

[dependencies]
vc-ltl = "5.2.2"
rand = "0.9.2"
colored = "3.0.0"
chrono = "0.4.41"
sysinfo = "0.36.1"
